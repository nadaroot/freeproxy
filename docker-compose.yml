services:
  smart-proxy-pool:
    build: .
    container_name: smart-proxy-pool
    restart: unless-stopped
    ports:
      - "8080:8080"   # Rotating Proxy Port
      - "5010:5010"   # Web Dashboard & REST API
    environment:
      - PROXY_PORT=8080
      - API_PORT=5010
      - MAX_CONCURRENT_CHECKS=150
      - CHECK_TIMEOUT=3.5
    volumes:
      - ./data:/app/data
